[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "edushield-backend"
version = "0.1.0"
description = "EduShield AI — financial aid fraud intelligence API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<2.2",
  "alembic>=1.13,<2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "email-validator>=2.1,<3",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8,<3",
  "cryptography>=42",
  "celery[redis]>=5.4,<6",
  "scikit-learn>=1.5,<2",
  "networkx>=3.3,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5",
  "httpx>=0.27,<1",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:passlib.*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "B008", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"app/seed/*" = ["S105", "S106"]
